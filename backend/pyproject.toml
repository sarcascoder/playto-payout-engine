[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.4",
    "dj-database-url>=2.3",
    "django>=5.0,<6.0",
    "django-celery-beat>=2.7",
    "django-cors-headers>=4.6",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "gunicorn>=25.3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "redis>=5.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "pytest>=8",
    "pytest-django>=4.9",
]
